<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>C’est La Vie | Perfumes Árabes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    <h1 style="color:red; font-size:40px">
SITE ATUALIZADO AGORA
</h1>

    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(160deg, #000 0%, #111 50%, #000 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Arial', sans-serif;
      color: #fff;
    }

    .container {
  backdrop-filter: blur(2px);
}


    h1 {
      font-size: 52px;
      color: #f5c400;
      margin-bottom: 5px;
    }

    .sub {
      letter-spacing: 4px;
      font-size: 12px;
      color: #aaa;
      margin-bottom: 35px;
    }

    h2 {
      color: #f5c400;
      font-size: 26px;
      margin-bottom: 15px;
    }

    p {
      color: #ddd;
      font-size: 16px;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    a {
      background: #f5c400;
      color: #000;
      padding: 14px 32px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }

    a:hover {
      transform: scale(1.08);
      background: #ffd633;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>C’est La Vie</h1>
    <div class="sub">PERFUMES ÁRABES</div>

    <h2>Luxo e tradição da perfumaria árabe</h2>
    <p>Perfumes intensos, sofisticados e inesquecíveis</p>

    <div class="buttons">
      <a href="#">WhatsApp</a>
      <a href="#">Instagram</a>
    </div>
  </div>

</body>
</html>
