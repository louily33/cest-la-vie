<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>C’est La Vie | Perfumes Árabes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  min-height: 100vh;
  font-size: 18px; /* tamanho base maior */
  background:
    linear-gradient(rgba(0,0,0,0.82), rgba(0,0,0,0.92)),
    url("https://mariambeauty.com.br/cdn/shop/files/597cf08f-5e09-4234-930f-43b1b2d3b209_affd2c07-50fa-4035-81d0-90c059b20c33.webp?v=1762742800&width=3840");
  background-size: cover;
  background-position: center top;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}

.container {
  text-align: center;
  max-width: 800px;
  padding: 40px;
}

h1 {
  font-size: 72px; /* LOGO GRANDE */
  color: #f5c400;
  margin-bottom: 10px;
}

.sub {
  font-size: 18px;
  letter-spacing: 6px;
  color: #ccc;
  margin-bottom: 45px;
}

h2 {
  font-size: 38px;
  color: #f5c400;
  margin-bottom: 20px;
}

p {
  font-size: 22px;
  color: #e0e0e0;
  margin-bottom: 50px;
  line-height: 1.5;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 25px;
  flex-wrap: wrap;
}

.btn {
  font-size: 20px;
  padding: 18px 45px;
  background: #f5c400;
  color: #000;
  text-decoration: none;
  border-radius: 50px;
  font-weight: bold;
  transition: all 0.3s ease;
}

.btn:hover {
  transform: scale(1.08);
  background: #ffd633;
}

.footer {
  margin-top: 70px;
  font-size: 15px;
  color: #aaa;
}
