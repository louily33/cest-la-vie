<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>C’est La Vie | Perfumes Árabes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
  min-height: 100vh;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;

  background:
    linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.9)),
    url("https://images.unsplash.com/photo-1600185365483-26d7a4cc7519")
    center / cover no-repeat;
}
    
    .container {
      max-width: 720px;
      text-align: center;
      padding: 20px;
    }

    .brand {
      font-size: 52px;
      color: #f5c400;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .tag {
      font-size: 12px;
      letter-spacing: 4px;
      color: #aaa;
      margin-bottom: 40px;
    }

    .headline {
      font-size: 26px;
      color: #f5c400;
      margin-bottom: 15px;
    }

    .desc {
      font-size: 16px;
      color: #ddd;
      margin-bottom: 45px;
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 34px;
      border-radius: 30px;
      background: #f5c400;
      color: #000;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s ease;
    }

    .btn:hover {
      transform: scale(1.08);
      background: #ffd633;
    }

    footer {
      margin-top: 60px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="brand">C’est La Vie</div>
    <div class="tag">PERFUMES ÁRABES</div>

    <div class="headline">Luxo e tradição da perfumaria árabe</div>
    <div class="desc">
      Trabalhamos exclusivamente com perfumes árabes, intensos,
      marcantes e de alto padrão.
    </div>

    <div class="buttons">
      <a href="#" class="btn">WhatsApp</a>
      <a href="#" class="btn">Instagram</a>
    </div>

    <footer>
      © C’est La Vie — Perfumes Árabes
    </footer>
  </div>

</body>
</html>
