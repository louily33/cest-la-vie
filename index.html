<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>C’est La Vie | Perfumes Árabes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #000;
    color: #fff;
}

/* HERO */
.hero {
    min-height: 100vh;
    background:
        linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.95)),
        url("https://cdn.pixabay.com/photo/2017/08/07/19/07/perfume-2602784_1280.jpg")
        center / cover no-repeat;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 20px;
}

/* LOGO TEXTO */
.logo {
    font-size: 3.2rem;
    font-weight: bold;
    color: gold;
    letter-spacing: 1px;
}

.sublogo {
    letter-spacing: 4px;
    font-size: 0.85rem;
    color: #ccc;
    margin-top: 5px;
}

/* TEXTO PRINCIPAL */
.hero h2 {
    margin-top: 50px;
    font-size: 2rem;
    color: gold;
}

.hero p {
    margin-top: 15px;
    font-size: 1.05rem;
    color: #ddd;
    max-width: 600px;
}

/* BOTÕES */
.botoes {
    margin-top: 40px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
}

.botoes a {
    padding: 15px 35px;
    border-radius: 40px;
    text-decoration: none;
    font-weight: bold;
    background: gold;
    color: #000;
    transition: 0.3s;
}

.botoes a:hover {
    transform: scale(1.05);
}

/* SEÇÃO FINAL */
.final {
    padding: 70px 20px;
    text-align: center;
    background: #000;
}

.final h3 {
    font-size: 1.8rem;
    color: gold;
    margin-bottom: 15px;
}

.final p {
    color: #bbb;
    font-size: 1rem;
    margin-bottom: 25px;
}

/* FOOTER */
footer {
    padding: 20px;
    text-align: center;
    font-size: 0.85rem;
    color: #777;
}
</style>
</head>

<body>

<section class="hero">
    <div class="logo">C’est La Vie</div>
    <div class="sublogo">PERFUMES ÁRABES</div>

    <h2>Luxo e tradição da perfumaria árabe</h2>
    <p>Perfumes intensos, sofisticados e inesquecíveis</p>

    <div class="botoes">
        <a href="https://wa.me/55SEUNUMERO" target="_blank">WhatsApp</a>
        <a href="https://instagram.com/SEUINSTAGRAM" target="_blank">Instagram</a>
    </div>
</section>

<section class="final">
    <h3>Especialistas em perfumes árabes</h3>
    <p>Trabalhamos exclusivamente com fragrâncias de alto padrão</p>
    <a href="https://wa.me/55SEUNUMERO" target="_blank" class="botoes">Consultar catálogo</a>
</section>

<footer>
    © 2026 C’est La Vie Perfumes
</footer>

</body>
</html>
